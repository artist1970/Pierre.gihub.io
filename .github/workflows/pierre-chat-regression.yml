name: Pierre public chat regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'pierre-conversation-v1.js'
      - 'creative-spark-mentor-qa-v1.js'
      - 'tests/mentor-qa-federation-integration.test.mjs'
      - 'knowledge/public-qa.v1.json'
      - 'tests/pierre-chat-integration.test.mjs'
      - '.github/workflows/pierre-chat-regression.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'pierre-conversation-v1.js'
      - 'knowledge/public-qa.v1.json'
      - 'tests/pierre-chat-integration.test.mjs'
permissions:
  contents: read
jobs:
  public-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/pierre-chat-integration.test.mjs tests/pierre-monte-carlo-qa.test.mjs tests/mentor-qa-federation-integration.test.mjs
